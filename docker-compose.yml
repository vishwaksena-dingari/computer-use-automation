# Local-friendly packaging: mock UI + optional one-shot cua slice in Docker.
services:
  mock:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    command: ["node", "scripts/serve-mock.mjs"]
    environment:
      MOCK_HOST: "0.0.0.0"
      MOCK_PORT: "4173"
    ports:
      - "4173:4173"

  cua:
    build: .
    depends_on:
      - mock
    environment:
      CUA_LOG: debug
      MOCK_URL: http://mock:4173
    # demo-slice starts its own mock on 4173 inside the container network namespace —
    # for compose we run train+run against the mock service instead.
    entrypoint: ["bash", "-lc"]
    command:
      - |
        set -euo pipefail
        npm run build
        node dist/cli/main.js discover --allow-offline-seed --base-url "$$MOCK_URL" --verbose
        node dist/cli/main.js replay capabilities/lookup-member-savings-balance.json \
          --member-id M-10042 --chapter 02-replay-happy --base-url "$$MOCK_URL" --verbose
        node dist/cli/main.js replay capabilities/lookup-member-savings-balance.json \
          --member-id M-99999 --chapter 03-replay-exception --base-url "$$MOCK_URL" --verbose
        echo compose-slice ok
