<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Apply — Company B</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input, textarea { width: 100%; margin-top: 0.25rem; padding: 0.4rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    #result { margin-top: 1rem; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Company B — Careers</h1>
  <form id="apply" action="#">
    <label for="legalName">Legal name</label>
    <input id="legalName" name="legalName" type="text" />

    <label for="emailAddress">Email address</label>
    <input id="emailAddress" name="emailAddress" type="email" />

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" />

    <label for="background">Tell us about your background</label>
    <textarea id="background" name="background" rows="4"></textarea>

    <button type="submit" id="submitBtn">Send</button>
  </form>
  <p id="result" hidden>Application received (Co B)</p>
  <script>
    document.getElementById('apply').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('result').hidden = false;
    });
  </script>
</body>
</html>
