<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Careers — Ashby-shaped demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; }
    .panel { border: 1px solid #ddd; padding: 1rem; border-radius: 6px; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input, select, textarea { width: 100%; margin-top: 0.25rem; padding: 0.4rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    .muted { color: #666; font-size: 0.9rem; }
    #result { font-weight: 700; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Open role — Automation Engineer</h1>
  <p class="muted">Ashby-shaped multi-section apply (local substitute for live ATS).</p>
  <div class="panel">
    <form id="apply">
      <h2>Contact</h2>
      <label for="fullName">Full name *</label>
      <input id="fullName" name="fullName" required />
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required />
      <label for="phone">Phone *</label>
      <input id="phone" name="phone" type="tel" required />

      <h2>Work</h2>
      <label for="workAuth">Work authorization *</label>
      <select id="workAuth" name="workAuth" required>
        <option value="">Select…</option>
        <option value="Authorized">Authorized</option>
        <option value="Needs sponsorship">Needs sponsorship</option>
      </select>
      <label for="whyCompany">Why us?</label>
      <textarea id="whyCompany" name="whyCompany" rows="3"></textarea>

      <button type="submit" id="submit">Submit application</button>
    </form>
    <p id="err" class="muted" hidden></p>
    <p id="result" hidden>Application received (Ashby-shaped)</p>
  </div>
  <script>
    document.getElementById('apply').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target;
      const err = document.getElementById('err');
      if (!f.fullName.value || !f.email.value || !f.phone.value || !f.workAuth.value) {
        err.hidden = false;
        err.textContent = 'Missing required fields (EEO/upload walls not simulated — use --escalate on live).';
        return;
      }
      err.hidden = true;
      document.getElementById('result').hidden = false;
    });
  </script>
</body>
</html>
